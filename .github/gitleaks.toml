# Default gitleaks rules plus two narrow path allowlists: vendored upstream libraries under contracts/lib/ (forge-std's
# curve constants read as generic keys) and recorded public venue data under packages/venue-client/fixtures/ (tx and
# order hashes). Every other path gets the full default rule set; ops/ci/check-vector-files.ts refuses key-like names
# in the fixtures.
title = "capstan gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "vendored upstream Solidity libraries"
paths = [
  '''^contracts/lib/''',
]

[[allowlists]]
description = "recorded public venue responses (tx and order hashes, no keys)"
paths = [
  '''^packages/venue-client/fixtures/''',
]

# Two made-up API keys in tests, excused by their exact line only (a path allowlist would excuse every other key in
# those files): the key-verify timing test in packages/tiers/test/keys.test.ts builds "cpst_01ARZ3NDEKTSV4RRFFQ69G5FAV_"
# + "A" x 43, and an old npm smoke test (ops/release/npm/capstan-mcp/smoke.mjs, removed, still in history) passed
# "cpst_acct_0123456789abcdef". Neither was ever a real key.
[[allowlists]]
description = "fake API keys in tests, by exact line"
regexTarget = "line"
regexes = [
  '''const key = "cpst_01ARZ3NDEKTSV4RRFFQ69G5FAV_" \+ "A"\.repeat\(43\);''',
  '''CAPSTAN_API_KEY: "cpst_acct_0123456789abcdef" \}''',
]

# A made-up local validator genesis hash (base58, 32 bytes) in the Solana genesis-guard test, by exact line: gitleaks'
# generic-api-key rule reads the "api.devnet" host next to it as a key name. A genesis hash is public chain data, and
# this one belongs to no network (devnet and mainnet genesis hashes are the two lines above it in the test).
[[allowlists]]
description = "made-up Solana genesis hash in the genesis-guard test, by exact line"
regexTarget = "line"
regexes = [
  '''assertLocalGenesis\("https://api\.devnet\.solana\.com", "2vrSEsUo2XJYd1hv4AJruEP1XkUx5goyUg65HFbka1XC"\)''',
]
