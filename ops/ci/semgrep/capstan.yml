# Local semgrep ruleset (no rule download in CI). Run: semgrep scan --config ops/ci/semgrep --error --metrics=off
rules:
  - id: no-eval
    languages: [typescript, javascript]
    severity: ERROR
    message: eval and new Function run arbitrary strings as code
    paths:
      # Accepted, one file: the Lighter signer worker runs Go's wasm_exec.js (a classic script that defines
      # globalThis.Go) with new Function after the host has checked its sha256 against the pinned value.
      exclude: ["/packages/signers/lighter-wasm/src/worker.mjs"]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: no-math-random-for-ids
    languages: [typescript, javascript]
    severity: ERROR
    message: Math.random is not a secure random source; use crypto.getRandomValues
    paths:
      # Accepted: the public site (web/site-src) uses Math.random only for animation jitter and one per-page SVG
      # element id; web/public/assets is that site's committed minified build. ops/load makes fake load-test prices.
      # None of these is an identifier anything trusts. Every server and package path keeps the rule.
      exclude: ["*.test.ts", "**/test/**", "/web/site-src/", "/web/public/assets/", "/ops/load/"]
    pattern: Math.random()
  - id: no-raw-key-from-env
    languages: [typescript, javascript]
    severity: ERROR
    message: service keys load only through keystoreSigner from a file path, never from an env value
    patterns:
      - pattern: process.env.$NAME
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(private_?key|mnemonic|seed_phrase).*
  - id: no-shell-with-template
    languages: [typescript, javascript]
    severity: ERROR
    message: build argv arrays for child processes; never a shell string with interpolation
    pattern-either:
      - pattern: require("child_process").exec(`...${$X}...`, ...)
      - pattern: exec(`...${$X}...`, ...)
      - pattern: execSync(`...${$X}...`, ...)
  - id: no-parsefloat-amounts
    languages: [typescript, javascript]
    severity: WARNING
    message: amounts are decimal strings or bigint (Dec); parseFloat loses precision
    paths:
      include: ["packages/**", "apps/**"]
      exclude: ["*.test.ts", "**/test/**"]
    patterns:
      - pattern: parseFloat($X)
      - metavariable-regex:
          metavariable: $X
          regex: (?i).*(amount|size|px|price|notional|fee|qty).*
  - id: no-tx-origin
    languages: [solidity]
    severity: ERROR
    message: tx.origin must not be used for authorization
    pattern: tx.origin
  - id: no-selfdestruct-or-delegatecall
    languages: [solidity]
    severity: ERROR
    message: the contracts are non-upgradeable and hold no foreign code paths
    pattern-either:
      - pattern: selfdestruct(...)
      - pattern: $X.delegatecall(...)
